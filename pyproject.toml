
[project]
name = "backend"
version = "0.1.0"
description = "TechTulana Nepal FastAPI backend"
readme = "README.md"
authors = [
    { name = "ujjwal-dahal", email = "toppelp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "firecrawl-py>=4.50.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-nvidia-ai-endpoints==1.4.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.15",
    "pydantic-settings>=2.15.0",
    "tavily-python>=0.8.5",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: calls the real Extractor API and external websites",
]
